# .pre-commit-config.yaml — pre-commit hooks configuration (prek)
# Docs: https://prek.j178.dev/configuration/
# The manual stage is the CI set: CI runs `prek run --all-files --hook-stage manual`.

minimum_prek_version: "0.3.2"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]

repos:
  # Builtin hooks — fast, offline, Rust-native
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  # Conventional Commits — enforce Conventional Commit message format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Secret / credential leak guard — fixtures and dotfiles must never carry tokens.
  # Local only: it scans --staged, so it finds nothing under --all-files.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  # Workflow linters
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  # Shared edbfi CI policy hooks
  - repo: https://github.com/edbfi/edbfi-ci
    rev: d07ccc13141d4aee4fa28546f4328f4e48d5363b  # frozen: v0.1.0
    hooks:
      - id: privileged-jobs
      - id: check-peers

  # Local hooks — project-specific quality gates
  - repo: local
    hooks:
      - id: bun-format-check
        name: bun format check
        entry: bun run format:check
        language: system
        files: ^(src|tests|scripts|migrations|static)/|^(package\.json|bun\.lock|biome\.json|components\.json|svelte\.config\.(js|ts)|vite\.config\.(js|ts)|uno\.config\.(js|ts)|tsconfig\.json)$
        pass_filenames: false
      - id: bun-lint
        name: bun lint
        entry: bun run lint
        language: system
        files: ^(src|tests|scripts|migrations)/|^(package\.json|bun\.lock|biome\.json|svelte\.config\.(js|ts)|vite\.config\.(js|ts)|uno\.config\.(js|ts)|tsconfig\.json)$
        pass_filenames: false
      - id: biome-migrate
        name: Migrate Biome configuration
        entry: bunx --no-install biome migrate --write
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: svelte-check
        name: svelte check
        entry: bun run check
        language: system
        files: ^(src|tests|scripts|migrations)/|^(package\.json|bun\.lock|svelte\.config\.(js|ts)|vite\.config\.(js|ts)|uno\.config\.(js|ts)|tsconfig\.json)$
        pass_filenames: false
      - id: bun-test
        name: bun test
        entry: bun run test
        language: system
        files: ^(src|tests|scripts|migrations)/|^(package\.json|bun\.lock|bunfig\.toml|tsconfig\.json|svelte\.config\.(js|ts)|vite\.config\.(js|ts))$
        pass_filenames: false
      - id: registry-validate
        name: model registry validation
        entry: bun run registry:validate
        language: system
        files: ^(src/lib/features/registry/|tests/.*/registry/|tests/fixtures/pricing/|scripts/[^/]*registry[^/]*\.ts$|evidence/|docs/model-audit/|package\.json$|bun\.lock$)
        pass_filenames: false
      - id: bun-build
        name: bun production build
        entry: bun --bun run build
        language: system
        files: ^(src|migrations|static)/|^(package\.json|bun\.lock|svelte\.config\.(js|ts)|vite\.config\.(js|ts)|uno\.config\.(js|ts)|tsconfig\.json)$
        pass_filenames: false
